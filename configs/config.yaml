data:
  dataset: "CIC-IDS-2018"
  time_window_seconds: 10
  sequence_length: 20
  forecast_horizon: 5

model:
  state_dim: 64
  hidden_dim: 128
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  learning_rate: 0.001
  batch_size: 64
  epochs: 25

mitre_stages:
  0: "Benign"
  1: "Reconnaissance"
  2: "Initial Access"
  3: "Execution"
  4: "Lateral Movement"
  5: "Command & Control"
  6: "Exfiltration"
